<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paidly — AI Proposals & Invoices for Freelancers</title>
<meta name="description" content="Generate winning proposals and professional invoices with AI in under 60 seconds. Win more clients. Get paid faster.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
/* ─── TOKENS ─────────────────────────────────────────── */
:root {
  --brand:#22c55e; --brand-d:#16a34a; --brand-dd:#14532d;
  --brand-m:#4ade80; --brand-l:#dcfce7; --brand-p:#f0fdf4;
  --ink-900:#0a0f1e; --ink-800:#111827; --ink-700:#1f2937;
  --ink-600:#374151; --ink-500:#6b7280; --ink-400:#9ca3af;
  --ink-300:#d1d5db; --ink-200:#e5e7eb; --ink-100:#f3f4f6;
  --ink-50:#f9fafb; --white:#fff;
  --dp:'Playfair Display',Georgia,serif;
  --bd:'Plus Jakarta Sans',system-ui,sans-serif;
  --r:12px; --r2:18px; --r3:24px;
  --sh-xs:0 1px 2px rgba(0,0,0,.05);
  --sh-sm:0 1px 3px rgba(0,0,0,.07),0 2px 8px rgba(0,0,0,.04);
  --sh-md:0 4px 16px rgba(0,0,0,.07),0 1px 4px rgba(0,0,0,.04);
  --sh-lg:0 8px 32px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.05);
  --sh-xl:0 24px 64px rgba(0,0,0,.12),0 4px 16px rgba(0,0,0,.06);
  --ease:cubic-bezier(.16,1,.3,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
body{font-family:var(--bd);background:var(--white);color:var(--ink-800);overflow-x:hidden;line-height:1.6}
button{font-family:var(--bd);cursor:pointer}
a{text-decoration:none}

/* ─── KEYFRAMES ──────────────────────────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes gradShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes barGrow{from{transform:scaleY(0);transform-origin:bottom}to{transform:scaleY(1);transform-origin:bottom}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes faqOpen{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}

/* ─── VIEW BAR ───────────────────────────────────────── */
.view-bar{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  height:48px;padding:0 1.5rem;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.96);backdrop-filter:blur(20px) saturate(180%);
  border-bottom:1px solid var(--ink-200);box-shadow:var(--sh-xs);
}
.vb-logo{display:flex;align-items:center;gap:9px}
.vb-mark{
  width:28px;height:28px;border-radius:7px;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:13px;
  box-shadow:0 2px 8px rgba(34,197,94,.35);
}
.vb-name{font-family:var(--dp);font-size:17px;font-weight:700;color:var(--ink-900)}
.vb-tabs{display:flex;gap:3px;background:var(--ink-100);padding:3px;border-radius:9px}
.vb-tab{
  padding:5px 16px;border-radius:6px;font-size:13px;font-weight:600;
  border:none;background:transparent;color:var(--ink-400);
  transition:all .18s var(--ease);
}
.vb-tab.active{background:var(--white);color:var(--ink-900);box-shadow:var(--sh-xs)}
.vb-tab:hover:not(.active){color:var(--ink-600)}

/* ─── LAYOUT ─────────────────────────────────────────── */
#landing{padding-top:48px}
#dashboard{display:none;height:100vh;overflow:hidden}

/* ─── SITE NAV ───────────────────────────────────────── */
.site-nav{
  position:sticky;top:48px;z-index:100;height:66px;padding:0 2rem;
  display:flex;align-items:center;justify-content:space-between;
  background:rgba(255,255,255,.85);backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid rgba(0,0,0,.06);
  transition:background .3s,box-shadow .3s;
}
.site-nav.scrolled{background:rgba(255,255,255,.97);box-shadow:var(--sh-sm)}
.nav-logo{display:flex;align-items:center;gap:10px}
.nav-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:15px;font-weight:800;
  box-shadow:0 2px 10px rgba(34,197,94,.3);
  transition:transform .2s var(--ease),box-shadow .2s;
}
.nav-logo:hover .nav-mark{transform:scale(1.08);box-shadow:0 4px 16px rgba(34,197,94,.4)}
.nav-name{font-family:var(--dp);font-size:21px;font-weight:700;color:var(--ink-900);letter-spacing:-.3px}
.nav-links{display:flex;align-items:center;gap:2px}
.nav-links a{padding:7px 14px;border-radius:var(--r);font-size:14px;font-weight:500;color:var(--ink-500);transition:all .15s}
.nav-links a:hover{color:var(--ink-900);background:var(--ink-100)}
.nav-right{display:flex;align-items:center;gap:8px}
.btn-ghost-nav{
  padding:8px 18px;border-radius:var(--r);font-size:14px;font-weight:600;
  color:var(--ink-600);border:1px solid var(--ink-200);background:transparent;transition:all .15s;
}
.btn-ghost-nav:hover{border-color:var(--ink-300);color:var(--ink-900);background:var(--ink-50)}
.btn-cta-nav{
  padding:9px 20px;border-radius:var(--r);font-size:14px;font-weight:700;
  color:#fff;border:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));
  box-shadow:0 1px 0 rgba(0,0,0,.08) inset,0 2px 12px rgba(34,197,94,.28);
  transition:all .18s var(--ease);display:flex;align-items:center;gap:6px;
}
.btn-cta-nav:hover{transform:translateY(-1px);box-shadow:0 1px 0 rgba(0,0,0,.08) inset,0 6px 20px rgba(34,197,94,.38)}
.btn-cta-nav:active{transform:translateY(0)}

/* ─── HERO ───────────────────────────────────────────── */
.hero{
  position:relative;overflow:hidden;
  min-height:calc(100vh - 114px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5rem 1.5rem 4rem;text-align:center;
}
.hero-bg{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.hero-glow{
  position:absolute;top:-20%;left:50%;transform:translateX(-50%);
  width:900px;height:600px;
  background:radial-gradient(ellipse at center,rgba(34,197,94,.09) 0%,rgba(34,197,94,.04) 40%,transparent 72%);
}
.hero-gridpat{
  position:absolute;inset:0;
  background-image:linear-gradient(rgba(34,197,94,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(34,197,94,.04) 1px,transparent 1px);
  background-size:48px 48px;
  mask-image:radial-gradient(ellipse 80% 60% at 50% 40%,black 30%,transparent 100%);
}
.hero-orb1{position:absolute;top:15%;right:12%;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.06),transparent 70%);animation:float 7s ease-in-out infinite}
.hero-orb2{position:absolute;bottom:20%;left:10%;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(99,102,241,.05),transparent 70%);animation:float 9s ease-in-out infinite reverse}
.hero-inner{position:relative;max-width:840px;margin:0 auto}

.hero-badge{
  display:inline-flex;align-items:center;gap:8px;padding:7px 18px;border-radius:50px;
  background:var(--white);border:1px solid rgba(34,197,94,.2);box-shadow:var(--sh-sm);
  font-size:13px;font-weight:600;color:var(--brand-d);margin-bottom:2rem;
  animation:fadeUp .65s var(--ease) both;
}
.badge-dot{width:7px;height:7px;border-radius:50%;background:var(--brand);animation:pulse 2s infinite}
.badge-sep{width:1px;height:14px;background:rgba(34,197,94,.25)}

.hero-h1{
  font-family:var(--dp);font-weight:800;color:var(--ink-900);
  font-size:clamp(3rem,7.5vw,5.2rem);line-height:1.04;letter-spacing:-1.5px;
  margin-bottom:1.5rem;animation:fadeUp .65s .08s var(--ease) both;
}
.hero-h1 .grad{
  background:linear-gradient(135deg,#22c55e 0%,#16a34a 50%,#15803d 100%);
  background-size:200% 200%;
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-style:italic;animation:gradShift 4s ease-in-out infinite;
}
.hero-sub{
  font-size:clamp(16px,2.2vw,19px);font-weight:400;color:var(--ink-500);
  max-width:580px;margin:0 auto 2.5rem;line-height:1.72;
  animation:fadeUp .65s .16s var(--ease) both;
}
.hero-actions{
  display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  animation:fadeUp .65s .24s var(--ease) both;
}
.btn-hero-p{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 28px;border-radius:var(--r);
  font-size:15px;font-weight:700;color:#fff;border:none;
  background:linear-gradient(135deg,var(--brand),var(--brand-d));
  box-shadow:0 2px 0 rgba(0,0,0,.12) inset,0 4px 20px rgba(34,197,94,.3);
  transition:all .2s var(--ease);position:relative;overflow:hidden;
}
.btn-hero-p::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.1),transparent)}
.btn-hero-p:hover{transform:translateY(-2px);box-shadow:0 2px 0 rgba(0,0,0,.12) inset,0 8px 28px rgba(34,197,94,.4)}
.btn-hero-p:active{transform:translateY(0)}
.btn-hero-s{
  display:inline-flex;align-items:center;gap:7px;
  padding:14px 24px;border-radius:var(--r);
  font-size:15px;font-weight:600;color:var(--ink-700);
  border:1px solid var(--ink-200);background:var(--white);box-shadow:var(--sh-xs);
  transition:all .18s;
}
.btn-hero-s:hover{border-color:var(--ink-300);color:var(--ink-900);box-shadow:var(--sh-sm);transform:translateY(-1px)}

.hero-social{
  display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;
  margin-top:2rem;animation:fadeUp .65s .32s var(--ease) both;
}
.av-stack{display:flex}
.av-item{
  width:30px;height:30px;border-radius:50%;border:2px solid var(--white);
  margin-left:-8px;display:flex;align-items:center;justify-content:center;
  font-size:9px;font-weight:800;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.15);
}
.av-item:first-child{margin-left:0}
.social-txt{font-size:13.5px;color:var(--ink-500)}
.social-txt strong{color:var(--ink-900);font-weight:700}
.social-divider{width:1px;height:16px;background:var(--ink-200)}
.social-rating{display:flex;align-items:center;gap:4px;font-size:13.5px;color:var(--ink-500)}
.stars-i{color:#f59e0b;letter-spacing:-1px}

/* ─── BROWSER MOCKUP ─────────────────────────────────── */
.mockup-wrap{
  position:relative;max-width:900px;margin:4rem auto 0;
  animation:fadeUp .7s .4s var(--ease) both;
}
.mockup-shadow{
  position:absolute;bottom:-40px;left:10%;right:10%;height:60px;
  background:radial-gradient(ellipse,rgba(34,197,94,.15) 0%,transparent 70%);
  filter:blur(20px);
}
.mockup-frame{
  border-radius:var(--r3);overflow:hidden;position:relative;z-index:1;
  box-shadow:0 0 0 1px rgba(0,0,0,.08),var(--sh-xl);
}
.mockup-chrome{
  background:linear-gradient(180deg,#2d3142,#222535);
  padding:13px 18px;display:flex;align-items:center;gap:10px;
}
.m-dots{display:flex;gap:6px}
.m-dot{width:11px;height:11px;border-radius:50%}
.m-dot.r{background:#ff5f57}.m-dot.y{background:#ffbd2e}.m-dot.g{background:#28c940}
.m-url{
  flex:1;max-width:260px;margin:0 auto;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.06);
  border-radius:6px;padding:5px 12px;font-size:11.5px;color:rgba(255,255,255,.45);
}
.mockup-body{background:var(--ink-50);display:flex;min-height:310px}

.m-sidebar{width:152px;background:var(--white);border-right:1px solid var(--ink-100);padding:14px 10px;flex-shrink:0}
.m-slogo{display:flex;align-items:center;gap:7px;padding:0 6px;margin-bottom:16px}
.m-slogo-mark{width:22px;height:22px;border-radius:5px;background:linear-gradient(135deg,var(--brand),var(--brand-d));display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.m-slogo-txt{font-family:var(--dp);font-size:13px;font-weight:700;color:var(--ink-900)}
.m-nav{padding:7px 10px;border-radius:7px;font-size:11.5px;font-weight:500;color:var(--ink-400);margin-bottom:1px;display:flex;align-items:center;gap:7px}
.m-nav.active{background:var(--brand-p);color:var(--brand-d);font-weight:600}

.m-content{flex:1;padding:14px}
.m-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:10px}
.m-stat{background:var(--white);border:1px solid var(--ink-100);border-radius:9px;padding:9px 10px}
.m-stat-v{font-family:var(--dp);font-size:13px;font-weight:700;color:var(--ink-900)}
.m-stat-l{font-size:9.5px;color:var(--ink-400);margin-top:1px;font-weight:500}
.m-chart{background:var(--white);border:1px solid var(--ink-100);border-radius:9px;padding:10px;margin-bottom:10px}
.m-chart-l{font-size:10px;font-weight:600;color:var(--ink-400);margin-bottom:8px;letter-spacing:.04em;text-transform:uppercase}
.m-bars{display:flex;align-items:flex-end;gap:5px;height:52px}
.m-bar{flex:1;border-radius:3px 3px 0 0;animation:barGrow .6s var(--ease) both}
.m-bar:nth-child(1){animation-delay:.1s}.m-bar:nth-child(2){animation-delay:.15s}
.m-bar:nth-child(3){animation-delay:.2s}.m-bar:nth-child(4){animation-delay:.25s}
.m-bar:nth-child(5){animation-delay:.3s}.m-bar:nth-child(6){animation-delay:.35s}
.m-bar:nth-child(7){animation-delay:.4s}
.m-table{background:var(--white);border:1px solid var(--ink-100);border-radius:9px;overflow:hidden}
.m-row{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:10.5px;border-bottom:1px solid var(--ink-50);gap:6px}
.m-row:last-child{border:none}
.m-badge{padding:2px 7px;border-radius:20px;font-size:9px;font-weight:700}
.m-badge.paid{background:var(--brand-l);color:#166534}
.m-badge.sent{background:#dbeafe;color:#1e40af}
.m-badge.over{background:#fee2e2;color:#991b1b}

/* ─── SCROLL ANIMATIONS ──────────────────────────────── */
.anim{opacity:0;transform:translateY(22px);transition:opacity .62s var(--ease),transform .62s var(--ease)}
.anim.in{opacity:1;transform:none}
.anim.d1{transition-delay:.08s}.anim.d2{transition-delay:.16s}
.anim.d3{transition-delay:.24s}.anim.d4{transition-delay:.32s}

/* ─── SECTION SHARED ─────────────────────────────────── */
.sec-inner{max-width:1100px;margin:0 auto;padding:0 1.5rem}
.sec-hdr{text-align:center;max-width:640px;margin:0 auto 4rem}
.sec-eye{
  display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:50px;
  background:var(--brand-p);border:1px solid rgba(34,197,94,.2);
  color:var(--brand-d);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;
  margin-bottom:1.25rem;
}
.sec-h{
  font-family:var(--dp);font-size:clamp(2rem,4.5vw,3rem);font-weight:800;
  color:var(--ink-900);line-height:1.12;letter-spacing:-.8px;margin-bottom:1rem;
}
.sec-h .grad{
  background:linear-gradient(135deg,var(--brand),var(--brand-d));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
  font-style:italic;
}
.sec-sub{font-size:17px;color:var(--ink-500);line-height:1.72}

/* ─── SOCIAL PROOF ───────────────────────────────────── */
.proof-sec{
  padding:5.5rem 1.5rem;background:var(--ink-50);
  border-top:1px solid var(--ink-200);border-bottom:1px solid var(--ink-200);
}
.proof-logos-lbl{
  text-align:center;font-size:11px;font-weight:700;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-300);margin-bottom:1.75rem;
}
.proof-logos{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:4rem}
.proof-logo{
  padding:10px 24px;font-size:14px;font-weight:800;color:var(--ink-300);
  letter-spacing:-.3px;border-right:1px solid var(--ink-200);
  transition:color .2s;
}
.proof-logo:last-child{border-right:none}
.proof-logo:hover{color:var(--ink-500)}

.tcards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:4rem}
.tcard{
  background:var(--white);border:1px solid var(--ink-200);border-radius:var(--r2);
  padding:1.75rem;box-shadow:var(--sh-sm);
  transition:transform .22s var(--ease),box-shadow .22s;
  display:flex;flex-direction:column;gap:1rem;
}
.tcard:hover{transform:translateY(-4px);box-shadow:var(--sh-md)}
.tcard-stars{color:#f59e0b;font-size:13px;letter-spacing:1px}
.tcard-q{font-size:14.5px;color:var(--ink-600);line-height:1.72;flex:1}
.tcard-q::before{
  content:'\201C';font-family:var(--dp);font-size:40px;color:var(--ink-200);
  line-height:0;vertical-align:-12px;margin-right:2px;
}
.tcard-author{display:flex;align-items:center;gap:10px;padding-top:1rem;border-top:1px solid var(--ink-100)}
.tcard-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.tcard-name{font-size:13.5px;font-weight:700;color:var(--ink-800)}
.tcard-role{font-size:12px;color:var(--ink-400);margin-top:1px}

.proof-stats{display:grid;grid-template-columns:repeat(4,1fr)}
.proof-stat{padding:2rem 1rem;text-align:center;border-right:1px solid var(--ink-200)}
.proof-stat:last-child{border-right:none}
.proof-stat-v{font-family:var(--dp);font-size:2.8rem;font-weight:700;color:var(--ink-900);line-height:1;margin-bottom:6px;letter-spacing:-1px}
.proof-stat-l{font-size:13.5px;color:var(--ink-400);font-weight:500}

/* ─── FEATURES ───────────────────────────────────────── */
.features-sec{padding:7rem 1.5rem;background:var(--white)}
.feat-grid{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:1px;background:var(--ink-100);border:1px solid var(--ink-100);
  border-radius:var(--r3);overflow:hidden;box-shadow:var(--sh-sm);
}
.feat-card{background:var(--white);padding:2rem;transition:background .2s;position:relative}
.feat-card:hover{background:var(--ink-50)}
.feat-card.hi{background:linear-gradient(145deg,var(--brand-p),var(--white))}
.feat-card.hi:hover{background:linear-gradient(145deg,#e8fdf0,var(--white))}
.feat-icon{width:44px;height:44px;border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:20px;margin-bottom:1.25rem}
.feat-tag{
  display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
  background:var(--brand-p);border:1px solid rgba(34,197,94,.2);
  color:var(--brand-d);font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
}
.feat-title{font-size:15.5px;font-weight:700;color:var(--ink-900);margin-bottom:.6rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.feat-desc{font-size:14px;color:var(--ink-500);line-height:1.68}

/* ─── HOW IT WORKS ───────────────────────────────────── */
.how-sec{
  padding:7rem 1.5rem;background:var(--ink-50);
  border-top:1px solid var(--ink-100);border-bottom:1px solid var(--ink-100);
}
.steps-row{display:grid;grid-template-columns:repeat(3,1fr);gap:2.5rem;margin-top:4rem;position:relative;text-align:center}
.steps-line{
  position:absolute;top:44px;
  left:calc(16.66% + 20px);right:calc(16.66% + 20px);
  height:1px;background:linear-gradient(90deg,var(--brand-m),rgba(124,58,237,.4),rgba(59,130,246,.4));
  opacity:.4;
}
.step-wrap{display:flex;flex-direction:column;align-items:center}
.step-icon{
  width:88px;height:88px;border-radius:22px;
  display:flex;align-items:center
